name: Apply V1.3.1 staged patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'v1.3.1-dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1.3.1 development branch
        uses: actions/checkout@v4
        with:
          ref: v1.3.1-dev
          fetch-depth: 0

      - name: Apply staged V1.3.1 patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .v131/patch.gz.b64 ]]; then
            base64 -d .v131/patch.gz.b64 | gzip -d > /tmp/v131.patch
            git apply --check /tmp/v131.patch
            git apply /tmp/v131.patch
            rm -rf .v131
            echo "applied=1" >> "$GITHUB_OUTPUT"
          else
            echo "applied=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile *.py

      - name: V1.3.0 static regression
        run: python test_static.py

      - name: Integration regression
        run: python test_integration.py

      - name: V1.3.1 failover and LP-rug regression
        run: python test_v131.py

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Commit validated V1.3.1 sources
        if: steps.patch.outputs.applied == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: stage V1.3.1 doctor, RPC failover and LP rug radar"
          git push origin HEAD:v1.3.1-dev
