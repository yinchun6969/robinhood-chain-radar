name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Static smoke test
        run: python test_static.py
      - name: Compile Python sources
        run: |
          python -m py_compile \
            monitor.py dashboard.py token_intel.py address_intel.py \
            fast_scanner.py event_worker.py swap_filter.py v4_resolver.py \
            native_scanner.py radar_supervisor.py
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find . -type f -name '*.sh' -print0)
