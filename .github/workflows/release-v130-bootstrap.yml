name: Release V1.3.0 bootstrap

on:
  issues:
    types: [opened]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  expand:
    if: (github.event_name == 'issues' && github.event.issue.title == '[release-v130] expand verified patch') || (github.event_name == 'pull_request' && github.head_ref == 'v1.3.0-dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-dev
          fetch-depth: 0
      - name: Verify and expand V1.3.0
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .release130b ]]; then
            test "$(find .release130b -maxdepth 1 -type f -name 'payload.*' | wc -l)" -eq 9
            cat .release130b/payload.* > /tmp/v130.b64
            base64 -d /tmp/v130.b64 > /tmp/v130-patch.tar.xz
            echo "746e8e564c71342cb3b84de204e1dbdd855c328e08215f42d11d06a6d4bd3251  /tmp/v130-patch.tar.xz" | sha256sum -c -
            tar -tJf /tmp/v130-patch.tar.xz >/dev/null
            tar -xJf /tmp/v130-patch.tar.xz -C .
            rm -rf .release130b .release130 .v130
            # GitHub Actions tokens cannot modify workflow files in this repository.
            # Keep workflow files unchanged here; the connected GitHub account updates them separately.
            git restore --source=HEAD -- .github/workflows/ci.yml
            git restore --source=HEAD -- .github/workflows/bootstrap-v130.yml
          fi
      - name: Validate staged source
        shell: bash
        run: |
          set -euo pipefail
          test -f token_radar.py
          test -f token_worker.py
          test -f test_integration.py
          grep -q 'V1.3.0' README.md
          python -m py_compile monitor.py dashboard.py token_intel.py token_radar.py token_worker.py address_intel.py fast_scanner.py event_worker.py swap_filter.py v4_resolver.py native_scanner.py radar_supervisor.py
          python test_static.py
          python test_integration.py
          while IFS= read -r -d '' f; do bash -n "$f"; done < <(find . -type f -name '*.sh' -print0)
      - name: Commit staged V1.3.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: stage Robinhood Chain Radar V1.3.0"
          git push origin HEAD:v1.3.0-dev
